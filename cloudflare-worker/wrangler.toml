# InstaIQ IG relay — Cloudflare Worker config.
# Deploy:  npx wrangler deploy
# Secret:  npx wrangler secret put RELAY_TOKEN   (mirror on Render as IG_GATEWAY_TOKEN)
name = "ig-relay"
main = "ig-relay.js"
compatibility_date = "2025-08-01"
account_id = "1ac17230e10b1fca9e20a4028b77f300"

# No bindings needed: the worker reads the RELAY_TOKEN secret from env at
# request time (set via `wrangler secret put`), and makes one outbound fetch
# to instagram.com — allowed on the Workers free plan.

[observability]
enabled = true
