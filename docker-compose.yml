version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Compose reads these from your shell or from a .env file next to
      # docker-compose.yml (see .env.example in backend/ for the full list).
      # live = real Instagram data via Apify (needs APIFY_TOKEN); cache =
      # local cache only; demo = simulated data.
      - DATA_MODE=${DATA_MODE:-live}
      - APIFY_TOKEN=${APIFY_TOKEN:-}
      - APIFY_ACTOR_ID=${APIFY_ACTOR_ID:-apify/instagram-scraper}
      - APIFY_RUN_TIMEOUT=${APIFY_RUN_TIMEOUT:-300}
      - PROFILE_CACHE_TTL=${PROFILE_CACHE_TTL:-1800}
      - FALLBACK_TO_DEMO=${FALLBACK_TO_DEMO:-false}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-minimax/minimax-m3}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
