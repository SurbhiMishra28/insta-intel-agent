# Render deployment — backend API (FastAPI + Docker)
# In the Render dashboard: New → Blueprint → pick this repo; Render reads
# this file and creates the service. Set the env vars marked "sync: false"
# in the dashboard (never commit real keys).
#
# Required environment variable (set in the Render dashboard):
#   LLM_API_KEY   — NVIDIA NIM key (https://build.nvidia.com), nvapi-...
# Optional:
#   APIFY_TOKEN   — enables the Apify provider (keyless fallback works without)
#   IG_PROXY_URL  — outbound proxy (http://user:pass@host:port) for the keyless
#                   Instagram layer. Instagram blocks Render's datacenter IP
#                   (401/429 on every call); a residential/mobile proxy URL
#                   here restores live fetching. Leave unset locally.
#
# Free-tier notes: the service spins down after ~15 min idle (cold start
# adds ~60s to the first request) and the filesystem is ephemeral — the
# profile cache and scan history reset on every redeploy. On a paid plan,
# switch plan to `starter` and re-add a persistent disk plus the two DB
# path env vars below to keep data across deploys:
#   PROFILE_CACHE_DB=/app/data/profile_cache.db
#   SCAN_HISTORY_DB=/app/data/scan_history.db
services:
  - type: web
    name: insta-intel-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_API_KEY
        sync: false          # set in dashboard: NVIDIA NIM key
      - key: APIFY_TOKEN
        sync: false          # optional; keyless fallback works without it
      - key: IG_PROXY_URL
        sync: false          # optional; residential proxy for IG fetches
      - key: DATA_MODE
        value: live
      # Headless Chrome (keyless fallback layer) tuning on a small container.
      - key: IG_CHROME_FETCH
        value: "true"
      - key: IG_PERMALINK_POSTS
        value: "4"
      - key: FALLBACK_TO_DEMO
        value: "false"
