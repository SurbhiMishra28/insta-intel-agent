# Render Blueprint — one-click deploy for the InstaIQ backend.
# Render reads this file when you choose "New +" → "Blueprint" on this repo.
services:
  - type: web
    name: instaiq-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DATA_MODE
        value: live
      # When data-provider credits run out, serve deterministic demo data
      # instead of erroring — auto-recovers when credits renew.
      - key: FALLBACK_TO_DEMO
        value: "true"
      # Secrets: set these in the Render dashboard after the first deploy
      # (marked sync:false so the blueprint never hardcodes them).
      - key: APIFY_TOKEN
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: GRAPH_ACCESS_TOKEN
        sync: false
      - key: GRAPH_IG_USER_ID
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false

  - type: web
    name: instaiq-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The static frontend calls the backend service directly.
      - key: VITE_API_URL
        value: https://instaiq-backend.onrender.com
