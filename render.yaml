# Render Blueprint — one-click deploy for the InstaIQ backend.
# Render reads this file when you choose "New +" → "Blueprint" on this repo.
services:
  - type: web
    name: instaiq-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      # Live public Instagram data via the Apify API (token below); every
      # fetch is cached so repeat analyses are instant and free.
      - key: DATA_MODE
        value: live
      # All AI analysis runs on NVIDIA NIM.
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      # Apify — live Instagram data. Set the real token in the Render
      # dashboard (instaiq-backend → Environment) after the first deploy.
      - key: APIFY_TOKEN
        value: your_apify_token_here
      # Secret: set this in the Render dashboard after the first deploy
      # (marked sync:false so the blueprint never hardcodes it).
      - key: LLM_API_KEY
        sync: false

  - type: web
    name: instaiq-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The static frontend calls the backend service directly.
      - key: VITE_API_URL
        value: https://instaiq-backend.onrender.com
